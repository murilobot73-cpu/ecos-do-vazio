name: Compilar mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Descobrir versões do Fabric para 26.3
        run: |
          MC=26.3
          API=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml \
            | grep -o "<version>[^<]*+${MC}[^<]*</version>" | sed 's/<[^>]*>//g' | tail -1)
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader \
            | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['version'])")
          LOOM=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml \
            | grep -o "<latest>[^<]*</latest>" | sed 's/<[^>]*>//g' | head -1)
          echo "api=$API loader=$LOADER loom=$LOOM"
          [ -n "$API" ] && sed -i "s/^fabric_api_version=.*/fabric_api_version=$API/" gradle.properties
          [ -n "$LOADER" ] && sed -i "s/^loader_version=.*/loader_version=$LOADER/" gradle.properties
          [ -n "$LOOM" ] && sed -i "s/^loom_version=.*/loom_version=$LOOM/" gradle.properties
          cat gradle.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Compilar
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ecos_do_vazio-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
